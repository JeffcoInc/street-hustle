<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Street Hustle</title>
<style>
:root { --bg: #0a0a0f; --card: #16161d; --text: #e0e0e0; --accent: #00ffcc; --profit: #00ff88; --debt: #ff5555; }
* { box-sizing: border-box; }
body { margin: 0; padding: 10px; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 16px; max-width: 480px; margin: 0 auto; }
.hud { display: flex; justify-content: space-between; background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 12px; font-weight: 600; }
.hud span { color: var(--accent); } .hud .debt { color: var(--debt); }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tabs button { flex: 1; padding: 12px; background: var(--card); color: var(--text); border: none; border-radius: 10px; font-weight: 600; }
.tabs button.active { background: var(--accent); color: #000; }
.card { background: var(--card); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.card button { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; }
.card button.sell { background: var(--profit); }
#map { background: var(--card); border-radius: 12px; padding: 8px; }
#map svg { width: 100%; height: 320px; background: #0d0d12; border-radius: 8px; }
.us-outline { fill: #1a1a22; stroke: #00ffcc44; stroke-width: 1.5; }
.city-node { cursor: pointer; fill: #222; stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 4px var(--accent)); }
.city-node.current { fill: var(--accent); stroke: #fff; filter: drop-shadow(0 0 8px var(--accent)); }
.city-node:hover { fill: #00aa88; }
.city-label { fill: var(--text); font-size: 9px; text-anchor: middle; pointer-events: none; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-content { background: var(--card); padding: 20px; border-radius: 16px; text-align: center; max-width: 90%; }
</style>
</head>
<body>
<div class="hud">
  <div>Cash: <span id="cash">2000</span></div>
  <div class="debt">Debt: <span id="debt">5500</span></div>
  <div>Day: <span id="day">1</span>/30</div>
</div>
<div class="tabs">
  <button class="active" onclick="showTab('market')">Market</button>
  <button onclick="showTab('map')">Map</button>
  <button onclick="showTab('inv')">Inventory</button>
</div>
<div id="market"></div>
<div id="map" style="display:none">
  <svg id="mapSvg" viewBox="0 0 500 300">
    <path class="us-outline" d="M 50 80 L 80 60 L 120 55 L 180 50 L 250 45 L 320 50 L 380 55 L 430 70 L 460 90 L 470 120 L 465 160 L 440 190 L 400 210 L 350 220 L 280 225 L 200 220 L 140 210 L 90 190 L 60 160 L 45 120 Z" />
    <circle class="city-node" cx="120" cy="70" r="8" data-city="0" onclick="travel(0)"></circle>
    <text class="city-label" x="120" y="60">NYC</text>
    <circle class="city-node" cx="130" cy="85" r="7" data-city="1" onclick="travel(1)"></circle>
    <text class="city-label" x="130" y="75">Brooklyn</text>
    <circle class="city-node" cx="280" cy="180" r="8" data-city="4" onclick="travel(4)"></circle>
    <text class="city-label" x="280" y="170">Miami</text>
    <circle class="city-node" cx="40" cy="140" r="8" data-city="5" onclick="travel(5)"></circle>
    <text class="city-label" x="40" y="130">LA</text>
    <circle class="city-node" cx="220" cy="90" r="8" data-city="6" onclick="travel(6)"></circle>
    <text class="city-label" x="220" y="80">Chicago</text>
    <circle class="city-node" cx="70" cy="150" r="8" data-city="7" onclick="travel(7)"></circle>
    <text class="city-label" x="70" y="140">Vegas</text>
    <circle class="city-node" cx="180" cy="160" r="8" data-city="8" onclick="travel(8)"></circle>
    <text class="city-label" x="180" y="150">Houston</text>
    <circle class="city-node" cx="250" cy="140" r="8" data-city="9" onclick="travel(9)"></circle>
    <text class="city-label" x="250" y="130">Atlanta</text>
    <circle class="city-node" cx="30" cy="50" r="8" data-city="10" onclick="travel(10)"></circle>
    <text class="city-label" x="30" y="40">Seattle</text>
    <circle class="city-node" cx="150" cy="110" r="8" data-city="11" onclick="travel(11)"></circle>
    <text class="city-label" x="150" y="100">Denver</text>
    <circle class="city-node" cx="160" cy="60" r="8" data-city="12" onclick="travel(12)"></circle>
    <text class="city-label" x="160" y="50">Boston</text>
    <circle class="city-node" cx="90" cy="160" r="8" data-city="13" onclick="travel(13)"></circle>
    <text class="city-label" x="90" y="150">Phoenix</text>
    <circle class="city-node" cx="200" cy="170" r="8" data-city="14" onclick="travel(14)"></circle>
    <text class="city-label" x="200" y="160">New Orleans</text>
  </svg>
  <p style="text-align:center; color:#888; font-size:14px;">Tap a city to travel</p>
</div>
<div id="inv" style="display:none"></div>
<div class="modal" id="eventModal"><div class="modal-content" id="eventContent"></div></div>
<div class="modal" id="endModal"><div class="modal-content"><h2>Run Complete</h2><p id="finalScore"></p><button onclick="buyExtra()">Buy +10 Days</button><button onclick="newGame()">New Game</button></div></div>
<script>
const GOODS = [{name:"Weed",min:300,max:900},{name:"Cocaine",min:15000,max:30000},{name:"Heroin",min:5000,max:14000},{name:"Acid",min:1000,max:4500},{name:"Speed",min:70,max:250},{name:"Ludes",min:10,max:60},{name:"Ecstasy",min:200,max:800},{name:"Meth",min:100,max:600}];
const CITIES = ["Bronx","Brooklyn","Manhattan","Queens","Miami","LA","Chicago","Vegas","Houston","Atlanta","Seattle","Denver","Boston","Phoenix","New Orleans"];
let state = {cash:2000,debt:5500,day:1,maxDays:30,city:0,inventory:{},prices:{},capacity:100};
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, duration=0.15) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function haptic(pattern=50) { if (navigator.vibrate) navigator.vibrate(pattern); }
function newPrices() { state.prices = {}; GOODS.forEach(g => state.prices[g.name] = Math.floor(Math.random()*(g.max-g.min)+g.min)); }
function updateMap() {
  document.querySelectorAll('.city-node').forEach((n,i) => n.classList.toggle('current', i === state.city));
}
function render() {
  document.getElementById("cash").textContent = state.cash.toLocaleString();
  document.getElementById("debt").textContent = state.debt.toLocaleString();
  document.getElementById("day").textContent = state.day;
  updateMap();
  let m = document.getElementById("market");
  m.innerHTML = "<h2>" + CITIES[state.city] + " Market</h2>";
  GOODS.forEach(g => {
    const price = state.prices[g.name]; const inv = state.inventory[g.name]||0;
    m.innerHTML += `<div class="card"><div>${g.name}<br><small>$${price.toLocaleString()}</small></div><div><button onclick="buy('${g.name}',1)">Buy</button><button class="sell" onclick="sell('${g.name}',1)">Sell (${inv})</button></div></div>`;
  });
  let invDiv = document.getElementById("inv");
  invDiv.innerHTML = "<h2>Inventory (" + Object.values(state.inventory).reduce((a,b)=>a+(b||0),0) + "/" + state.capacity + ")</h2>";
  GOODS.forEach(g => { const q = state.inventory[g.name]||0; if(q>0) invDiv.innerHTML += `<div class="card"><div>${g.name}: ${q}</div></div>`; });
}
function buy(name,qty) {
  const price = state.prices[name]; const cost = price*qty;
  const current = Object.values(state.inventory).reduce((a,b)=>a+(b||0),0);
  if (state.cash >= cost && current + qty <= state.capacity) {
    state.cash -= cost; state.inventory[name] = (state.inventory[name]||0)+qty;
    playTone(800); haptic(30);
    render();
  }
}
function sell(name,qty) {
  const have = state.inventory[name]||0;
  if (have >= qty) {
    state.cash += state.prices[name]*qty; state.inventory[name]-=qty;
    if (state.inventory[name]===0) delete state.inventory[name];
    playTone(1200); haptic(30);
    render();
  }
}
function travel(to) {
  if (to === state.city) return;
  state.city = to; state.day++; state.debt = Math.floor(state.debt * 1.1);
  newPrices(); playTone(400, 0.3); haptic([100,50,100]);
  if (Math.random() < 0.4) triggerEvent();
  if (state.day > state.maxDays) endGame(); else render();
}
function triggerEvent() {
  const events = [
    {title:"Police Stop!", text:"Officer Hardass pulls you over. What do you do?", choices:["Bribe $500","Run","Fight"]},
    {title:"Mugger!", text:"A mugger jumps you in the alley!", choices:["Give Cash","Fight"]},
    {title:"Crackhead", text:"A crackhead approaches offering a 'deal'.", choices:["Ignore","Give Free Sample","Sell High"]},
    {title:"Lucky Find", text:"You found a stash of free goods!", choices:["Take It"]}
  ];
  const ev = events[Math.floor(Math.random()*events.length)];
  const modal = document.getElementById("eventModal");
  const content = document.getElementById("eventContent");
  content.innerHTML = `<h3>${ev.title}</h3><p>${ev.text}</p>` + ev.choices.map((c,i)=>`<button onclick="handleEvent(${i}, '${ev.title}')">${c}</button>`).join(" ");
  modal.style.display = "flex"; playTone(200, 0.4); haptic(200);
}
function handleEvent(choice, title) {
  document.getElementById("eventModal").style.display = "none";
  if (title.includes("Police")) {
    if (choice===0 && state.cash>=500) { state.cash-=500; }
    else if (choice===1 && Math.random()<0.6) { }
    else { state.cash = Math.max(0, state.cash-200); }
  } else if (title.includes("Mugger")) {
    state.cash = Math.max(0, state.cash - Math.floor(state.cash*0.2));
  } else if (title.includes("Crackhead")) {
    if (choice===2) state.cash += 300;
  } else if (title.includes("Lucky")) {
    const g = GOODS[Math.floor(Math.random()*GOODS.length)].name;
    state.inventory[g] = (state.inventory[g]||0)+5;
  }
  render();
}
function endGame() {
  const score = state.cash - state.debt;
  document.getElementById("finalScore").textContent = "Final: $" + score.toLocaleString();
  document.getElementById("endModal").style.display = "flex";
}
function buyExtra() { state.maxDays += 10; document.getElementById("endModal").style.display = "none"; alert("Extra days added!"); render(); }
function newGame() {
  state = {cash:2000,debt:5500,day:1,maxDays:30,city:0,inventory:{},prices:{},capacity:100};
  newPrices(); document.getElementById("endModal").style.display = "none"; render();
}
function showTab(tab) {
  ["market","map","inv"].forEach(t => document.getElementById(t).style.display = t===tab ? "block" : "none");
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
}
newPrices(); render();
</script>
</body>
</html>
